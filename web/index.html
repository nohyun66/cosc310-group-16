<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurants</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
    }

    #page-layout {
      align-items: start;
      display: grid;
      gap: 16px;
      grid-template-columns: 156px minmax(0, 1fr);
    }

    #search-panel {
      border: 2px solid black;
      min-height: 540px;
      padding: 8px;
    }

    #search-panel h1 {
      font-size: 1.5rem;
      font-weight: normal;
      margin: 0 0 20px;
    }

    #search-form label {
      display: block;
      margin: 16px 0 6px;
    }

    #search-form input,
    #search-form select,
    #search-form button {
      box-sizing: border-box;
      max-width: 100%;
      width: 100%;
    }

    #search-form button {
      margin-top: 16px;
    }

    #restaurants {
      align-items: start;
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
    }

    .restaurant-card {
      border: 2px solid black;
      box-sizing: border-box;
      padding: 7px;
    }

    .restaurant-image {
      align-items: center;
      border: 2px solid black;
      box-sizing: border-box;
      display: flex;
      height: 130px;
      justify-content: center;
      overflow: hidden;
    }

    .restaurant-image img {
      height: 100%;
      object-fit: cover;
      width: 100%;
    }

    .restaurant-image-link,
    .restaurant-name-link {
      color: inherit;
      text-decoration: none;
    }

    .restaurant-image-link {
      display: block;
      height: 100%;
      width: 100%;
    }

    .restaurant-image-link:focus-visible,
    .restaurant-name-link:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .restaurant-info {
      display: flex;
      justify-content: space-between;
      margin: 7px 2px 10px;
    }

    .restaurant-name {
      margin: 0;
    }

    .restaurant-cuisine,
    .restaurant-open {
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .restaurant-rating,
    .restaurant-open {
      text-align: right;
      white-space: nowrap;
    }

    .restaurant-info > div:last-child {
      flex-shrink: 0;
    }

    .restaurant-description {
      border: 2px solid black;
      min-height: 50px;
      padding: 4px;
    }

    @media (max-width: 640px) {
      #page-layout {
        grid-template-columns: 1fr;
      }

      #search-panel {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div id="page-layout">
    <aside id="search-panel">
      <h1>Search</h1>
      <form id="search-form">
        <label for="name-search">By name</label>
        <input
          id="name-search"
          name="search"
          type="search"
          placeholder="Restaurant name"
          list="restaurant-name-suggestions"
        >
        <datalist id="restaurant-name-suggestions"></datalist>

        <label for="cuisine-search">By cuisine</label>
        <select id="cuisine-search" name="cuisine">
          <option value="">All cuisines</option>
          <option value="NORAM">North American</option>
          <option value="ASIAN">Asian</option>
          <option value="MED">Mediterranean</option>
          <option value="LATAM">Latin American</option>
          <option value="EURO">European</option>
        </select>
        <button type="submit">Search</button>
      </form>
    </aside>
    <section>
      <p id="status" aria-live="polite">Loading restaurants...</p>
      <main id="restaurants" aria-label="Restaurants"></main>
    </section>
  </div>

  <script>
    const status = document.getElementById("status");
    const list = document.getElementById("restaurants");
    const searchForm = document.getElementById("search-form");
    const nameSuggestions = document.getElementById("restaurant-name-suggestions");
    let allRestaurants = [];

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      loadRestaurants(new FormData(searchForm));
    });

    function createRestaurantCard(restaurant) {
      const card = document.createElement("article");
      card.className = "restaurant-card";

      const imageFrame = document.createElement("div");
      imageFrame.className = "restaurant-image";
      const imageLink = document.createElement("a");
      imageLink.className = "restaurant-image-link";
      imageLink.href = `restaurant.html?id=${encodeURIComponent(restaurant.id)}`;
      const image = document.createElement("img");
      image.src = restaurant.image_url;
      image.alt = `${restaurant.name} restaurant`;
      imageLink.append(image);
      imageFrame.append(imageLink);

      const info = document.createElement("div");
      info.className = "restaurant-info";

      const identity = document.createElement("div");
      const nameLink = document.createElement("a");
      nameLink.className = "restaurant-name-link";
      nameLink.href = `restaurant.html?id=${encodeURIComponent(restaurant.id)}`;
      const name = document.createElement("h2");
      name.className = "restaurant-name";
      name.textContent = restaurant.name;
      nameLink.append(name);
      const cuisine = document.createElement("div");
      cuisine.className = "restaurant-cuisine";
      cuisine.textContent = restaurant.cuisine;
      identity.append(nameLink, cuisine);

      const details = document.createElement("div");
      const rating = document.createElement("div");
      rating.className = "restaurant-rating";
      rating.textContent = `${restaurant.rating} ☆`;
      const open = document.createElement("div");
      open.className = "restaurant-open";
      open.textContent = restaurant.is_open ? "Is open" : "Closed";
      details.append(rating, open);

      info.append(identity, details);

      const description = document.createElement("div");
      description.className = "restaurant-description";
      description.textContent = restaurant.description;

      card.append(imageFrame, info, description);
      return card;
    }

    async function loadRestaurants(filters = new FormData()) {
      try {
        const params = new URLSearchParams();
        const search = filters.get("search")?.toString().trim();
        const cuisine = filters.get("cuisine")?.toString();
        if (search) {
          params.set("search", search);
        }
        if (cuisine) {
          params.set("cuisine", cuisine);
        }

        const query = params.toString();
        const response = await fetch(`/restaurants${query ? `?${query}` : ""}`);
        if (!response.ok) {
          throw new Error(`Request failed (${response.status})`);
        }

        const restaurants = await response.json();
        list.replaceChildren(...restaurants.map(createRestaurantCard));
        if (!search && !cuisine) {
          allRestaurants = restaurants;
          nameSuggestions.replaceChildren(
            ...allRestaurants.map((restaurant) => {
              const option = document.createElement("option");
              option.value = restaurant.name;
              return option;
            })
          );
        }
        status.textContent = restaurants.length
          ? ""
          : "No restaurants found.";
      } catch (error) {
        status.textContent = `Could not load restaurants: ${error.message}`;
      }
    }

    loadRestaurants();
  </script>
</body>
</html>
